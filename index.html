<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agente</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E7D32">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>
:root{--p:#333;--a:#007bff;--bg:#F8F9FA;--tx:#2C3E50}
*{box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,Roboto,sans-serif;background:#eef2f3;margin:0;padding:24px;color:var(--tx)}
#fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));box-shadow:0 8px 25px #0003;cursor:pointer;z-index:9999;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.ico{width:42px;height:42px;object-fit:contain;border-radius:50%}
#win{position:fixed;right:20px;bottom:calc(100px + env(safe-area-inset-bottom,0px));width:380px;max-width:calc(100vw - 30px);height:min(560px,calc(100dvh - 130px));background:#fff;border-radius:24px;box-shadow:0 15px 40px #00000026;display:none;flex-direction:column;overflow:hidden;z-index:9998}
#win.active{display:flex}
#win.full{right:0;bottom:0;width:100vw;max-width:none;height:100dvh;border-radius:0}
#win.full ~ #fab{display:none}
header{background:linear-gradient(135deg,var(--p),var(--a));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
header h3{margin:0;font-size:17px;flex:1}
header .ico{width:32px;height:32px}
header button,header select{background:#fff3;border:0;color:#fff;border-radius:10px;padding:6px 9px;font-size:13px;cursor:pointer}
header select option{color:#000}
#log{flex:1;overflow-y:auto;padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:11px 15px;border-radius:16px;line-height:1.5;font-size:14.5px;box-shadow:0 2px 8px #0000000d;word-wrap:break-word}
.bot{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.user{background:var(--p);color:#fff;align-self:flex-end;border-top-right-radius:4px}
#chips{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#fff;border-top:1px solid #eee}
#chips button{flex:none;background:var(--bg);border:2px solid #e0dcd3;border-radius:12px;padding:8px 12px;font-weight:600;color:var(--p);font-size:13px;cursor:pointer}
#chips button:active{background:var(--a);color:#fff}
#form{display:flex;gap:6px;padding:10px;background:#fff;border-top:1px solid #eee;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#inp{flex:1;border:2px solid #e0dcd3;border-radius:12px;padding:10px 12px;font-size:15px;min-width:0}
#form button{border:0;border-radius:12px;padding:0 14px;font-size:18px;cursor:pointer;background:var(--p);color:#fff}
#mic.on{background:#e74c3c;animation:pu 1s infinite}
@keyframes pu{50%{opacity:.6}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main><h1 id="pageTitle"></h1><p id="pageDesc"></p></main>
<section id="win" aria-label="Agente">
  <header>
    <img class="ico" src="assets/mascota.png" alt="">
    <h3 id="name">Asistente</h3>
    <select id="mode" aria-label="Modo de voz"></select>
    <button id="install" hidden>📲 Instalar</button>
    <button id="close" aria-label="Cerrar">✕</button>
  </header>
  <div id="log"></div>
  <div id="chips"></div>
  <form id="form">
    <input id="inp" placeholder="Escribí tu mensaje…" autocomplete="off">
    <button type="button" id="mic" aria-label="Hablar">🎤</button>
    <button type="submit" aria-label="Enviar">➤</button>
  </form>
</section>
<button id="fab" aria-label="Abrir asistente"><img class="ico" src="assets/mascota.png" alt=""></button>
<script>
const $ = id => document.getElementById(id);
const SDK = 'https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.30.0/+esm';
let cfg, mode, conv = null, connecting = null, history = [], listening = false, rec = null, installEvt = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ');

function add(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role; d.innerHTML = fmt(text);
  $('log').appendChild(d); $('log').scrollTop = 1e9; return d;
}
function speak(t) {
  if (mode !== 'browser' || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/\*\*/g, '')); u.lang = cfg.voice.lang || 'es-AR'; speechSynthesis.speak(u);
}
function reply(t) { add('bot', t); history.push({role: 'assistant', content: t}); speak(t); }
function setMic(on) { listening = on; $('mic').classList.toggle('on', on); }

function faq(t) {
  const w = norm(t).split(' ').filter(x => x.length > 3); let best = null, sc = 0;
  for (const q of cfg.behavior.suggestedQuestions) {
    const n = norm(q.text + ' ' + q.answer), s = w.filter(x => n.includes(x)).length;
    if (s > sc) { sc = s; best = q; }
  }
  return best ? best.answer : 'Todavía no tengo una respuesta para eso. Probá con una de las preguntas sugeridas.';
}

async function callLLM() {
  const a = cfg.ai.openai, h = {'Content-Type': 'application/json'};
  let key = '';
  if (a.keyMode === 'inline') key = a.apiKey;
  if (a.keyMode === 'visitor') {
    try { key = localStorage.getItem('agent_key') || ''; } catch (e) {}
    if (!key) { key = prompt('Pegá tu clave de API (queda solo en este navegador):') || ''; try { localStorage.setItem('agent_key', key); } catch (e) {} }
  }
  if (key) h.Authorization = 'Bearer ' + key;
  const sys = cfg.behavior.systemPrompt || cfg.behavior.personality;
  const r = await fetch(a.endpoint, {method: 'POST', headers: h,
    body: JSON.stringify({model: a.model, messages: [{role: 'system', content: sys}, ...history.slice(-20)]})});
  if (!r.ok) throw new Error('El servicio de IA respondió con error ' + r.status);
  return (await r.json()).choices[0].message.content;
}

async function endEL() { if (conv) { try { await conv.endSession(); } catch (e) {} conv = null; } }
async function ensureEL(voice) {
  if (conv && conv.__voice === voice) return;
  if (connecting) return connecting;
  await endEL();
  connecting = (async () => {
    const {Conversation} = await import(SDK);
    const o = {agentId: cfg.ai.elevenlabs.agentId, connectionType: voice ? 'webrtc' : 'websocket',
      onMessage: m => { if (m.source === 'ai') { add('bot', m.message); speak(m.message); } },
      onDisconnect: () => { conv = null; setMic(false); }};
    if (!voice) o.textOnly = true; else await navigator.mediaDevices.getUserMedia({audio: true});
    conv = await Conversation.startSession(o); conv.__voice = voice;
  })();
  try { await connecting; } finally { connecting = null; }
}

async function ask(text) {
  add('user', text); history.push({role: 'user', content: text});
  const typing = add('bot', '…');
  try {
    const p = cfg.ai.provider;
    if (p === 'elevenlabs') { await ensureEL(mode === 'elevenlabs'); conv.sendUserMessage(text); typing.remove(); return; }
    const out = p === 'openai-compatible' ? await callLLM() : faq(text);
    typing.remove(); reply(out);
  } catch (e) { typing.remove(); add('bot', '⚠️ ' + e.message); }
}

async function onMic() {
  if (mode === 'elevenlabs') {
    if (conv && conv.__voice) { await endEL(); setMic(false); return; }
    try { await ensureEL(true); setMic(true); } catch (e) { add('bot', '⚠️ ' + e.message); }
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return add('bot', 'Este navegador no soporta reconocimiento de voz. Escribí tu mensaje.');
  if (listening) { rec.stop(); return; }
  rec = new SR(); rec.lang = cfg.voice.lang || 'es-AR';
  rec.onresult = e => ask(e.results[0][0].transcript); rec.onend = rec.onerror = () => setMic(false);
  rec.start(); setMic(true);
}

function buildModes() {
  const o = [['browser', '🔊 Voz del navegador (gratis)'], ['text', '💬 Solo texto']];
  if (cfg.ai.provider === 'elevenlabs') o.splice(1, 0, ['elevenlabs', '🎙️ ElevenLabs (usa créditos)']);
  $('mode').innerHTML = o.map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
  mode = o.some(x => x[0] === cfg.voice.mode) ? cfg.voice.mode : 'browser';
  $('mode').value = mode; $('mic').hidden = mode === 'text';
  $('mode').onchange = async () => {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    await endEL(); setMic(false); mode = $('mode').value; $('mic').hidden = mode === 'text';
    if (mode === 'elevenlabs') add('bot', 'Modo ElevenLabs: cada conversación usa créditos de la cuenta del agente. Tocá 🎤 para hablar.');
  };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
$('install').onclick = async () => {
  if (installEvt) { installEvt.prompt(); installEvt = null; $('install').hidden = true; }
  else add('bot', 'En iPhone: tocá Compartir ⬆️ y elegí «Agregar a pantalla de inicio».');
};
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone) $('install').hidden = false;

(async () => {
  try { cfg = await (await fetch('skill.json', {cache: 'no-cache'})).json(); }
  catch (e) { $('pageDesc').textContent = 'No se pudo leer skill.json'; return; }
  const r = document.documentElement.style; r.setProperty('--p', cfg.ui.primaryColor); r.setProperty('--a', cfg.ui.accentColor);
  document.title = cfg.name; $('name').textContent = cfg.name; $('pageTitle').textContent = cfg.name; $('pageDesc').textContent = cfg.description || '';
  document.querySelectorAll('.ico').forEach(i => i.src = cfg.ui.icon);
  add('bot', cfg.behavior.greeting);
  cfg.behavior.suggestedQuestions.forEach(q => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = q.text;
    b.onclick = () => { if (cfg.ai.provider === 'faq') { add('user', q.text); reply(q.answer); } else ask(q.text); };
    $('chips').appendChild(b);
  });
  $('chips').hidden = !cfg.behavior.suggestedQuestions.length;
  buildModes();
  $('fab').onclick = () => $('win').classList.add('active');
  $('close').onclick = () => $('win').classList.remove('active');
  $('mic').onclick = onMic;
  $('form').onsubmit = e => { e.preventDefault(); const t = $('inp').value.trim(); if (t) { $('inp').value = ''; ask(t); } };
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('win').classList.add('active', 'full');
})();
</script>
</body>
</html>
